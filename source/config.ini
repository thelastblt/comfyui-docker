[default]
# ComfyUI-Manager security policy (https://github.com/ltdrdata/ComfyUI-Manager#security-policy):
# the server listens on 0.0.0.0, so the manager treats it as non-local and blocks
# install/update actions unless network_mode is personal_cloud.
network_mode = personal_cloud
# 'weak' also allows high-risk actions (e.g. installing from arbitrary git URLs).
# Fine for a single-user personal box; tighten if you ever expose the UI wider.
security_level = normal
