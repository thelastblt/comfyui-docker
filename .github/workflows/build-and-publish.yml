# Builds the ComfyUI Docker image and publishes it to the GitHub Container Registry
name: Build & Publish ComfyUI

# Runs when a semantic versioning tag (vX.Y.Z) is pushed; the tag is created when a new
# release is created. The release event itself cannot be used because
# docker/metadata-action does not support it
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# Serialize workflow runs for the same tag so re-triggering a tag does not start a parallel publish
concurrency:
  group: build-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Builds the image from the dependency versions pinned in the Dockerfile, pushes it to
  # the GitHub Container Registry tagged with "latest" and the semantic version, and
  # attaches a provenance attestation. If a fallback variant ever becomes necessary
  # (e.g. a CUDA 13.4 regression, or a CUDA 12 image for users locked on old drivers),
  # re-introduce a second matrix entry rather than complicating the default build
  build-and-publish:

    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      # Required to read/write the GitHub Actions build cache (type=gha)
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      
      # Prints the dependency versions the image will be built with, so the release
      # log visibly records exactly what is being published
      - name: Show Dependency Versions
        run:
          grep -E '^ARG (COMFYUI_VERSION|PYTORCH_VERSION|CUDA_VERSION|CUDNN_VERSION)=' source/Dockerfile
     
      # Logs in with the automatically generated GITHUB_TOKEN; the permissions above
      # allow it to publish packages, which are scoped to the triggering account
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Creates the image name, tags, and labels; the image name is forced to lowercase
      # as required by GHCR. The only tags are the semantic version from the git tag and
      # "latest", which the default flavor adds automatically on tag push events
      - name: Create Tags & Labels for the Docker Image
        id: docker-image-metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=ComfyUI Docker
            org.opencontainers.image.authors=thelastblt

      # Builds the image using the dependency versions pinned in the Dockerfile (the
      # ARG defaults apply, so no build-args are needed) and pushes it to the registry.
      # Build layers are cached in the GitHub Actions cache, scoped per tag, so a re-run
      # of the same tag resumes from the cache instead of pulling and rebuilding
      - name: Build and Push the Docker Image
        id: build-and-push-docker-image
        uses: docker/build-push-action@v7
        with:
          context: source
          push: true
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}
          tags: ${{ steps.docker-image-metadata.outputs.tags }}
          labels: ${{ steps.docker-image-metadata.outputs.labels }}

      # Generates an artifact attestation - an unforgeable statement about where and how
      # the image was built - and pushes it to the registry alongside the image
      - name: Generate Artifact Attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build-and-push-docker-image.outputs.digest }}
          push-to-registry: true
